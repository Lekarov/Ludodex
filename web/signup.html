<body>
<header class="top"><div class="brand"><img src="img/logo-ludodex.png" alt="Ludodex"><small>compte</small></div><a href="login.html">Déjà inscrit ?</a></header>
<main>
  <div class="card">
    <h1>Créer un compte</h1>
    <p class="sub">Obligatoire pour jouer : un compte = un joueur, tes pièces et ta collection sont liées à ton compte.</p>

    <div class="oauth">
      <button class="btn" type="button" id="oauthGoogle"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>Continuer avec Google</button>
      <button class="btn" type="button" id="oauthDiscord"><svg width="18" height="18" viewBox="0 0 127.14 96.36" aria-hidden="true"><path fill="#5865F2" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>Continuer avec Discord</button>
    </div>
    <div class="sep">ou avec un email</div>

    <form id="signupForm" novalidate>
      <label for="email">Adresse email</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="username">Pseudo</label>
      <input type="text" id="username" autocomplete="username" minlength="3" maxlength="24" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="new-password" minlength="8" required>

      <label for="password2">Confirmer le mot de passe</label>
      <input type="password" id="password2" autocomplete="new-password" minlength="8" required>

      <label class="chk"><input type="checkbox" id="ageConfirm" required>
        Je certifie avoir 13 ans ou plus.</label>

      <label class="chk"><input type="checkbox" id="acceptTerms" required>
        J'ai lu et j'accepte les <a href="terms.html" target="_blank">conditions d'utilisation</a>
        et la <a href="privacy-policy.html" target="_blank">politique de confidentialité</a>.</label>

      <button class="btn primary" type="submit" id="submitBtn">Créer mon compte</button>
      <div class="msg" id="formMsg"></div>
    </form>

    <div class="foot-links">
      <a href="legal-notice.html">Mentions légales</a>
      <a href="privacy-policy.html">Confidentialité</a>
      <a href="terms.html">CGU</a>
    </div>
  </div>
