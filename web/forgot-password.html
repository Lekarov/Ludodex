<html lang="fr">
<head>

<link rel="icon" href="assets/logo-ludodex.png" type="image/png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://YOUR_PROJECT_REF.supabase.co wss://YOUR_PROJECT_REF.supabase.co https://api.ipify.org; object-src 'none'; base-uri 'self'; form-action 'self'">

<body>
<header class="top"><div class="brand"><img src="img/logo-ludodex.png" alt="Ludodex"><small>compte</small></div><a href="login.html">Retour à la connexion</a></header>
<main>
  <div class="card">
    <h1>Mot de passe oublié</h1>
    <p class="sub">On t'envoie un lien de réinitialisation par email.</p>

    <form id="resetForm" novalidate>
      <label for="email">Adresse email</label>
      <input type="email" id="email" autocomplete="email" required>
      <button class="btn primary" type="submit" id="submitBtn">Envoyer le lien</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>
</main>
<footer class="site">Ludodex Online</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
