<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe — Ludodex Online</title>
<link rel="icon" href="assets/logo-ludodex.png" type="image/png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.ipify.org; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<header class="top"><div class="brand"><img src="img/logo-ludodex.png" alt="Ludodex"><small>compte</small></div></header>
<main>
  <div class="card">
    <h1>Choisir un nouveau mot de passe</h1>
    <p class="sub">Tu arrives ici depuis le lien reçu par email.</p>

    <form id="newPasswordForm" novalidate>
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" autocomplete="new-password" minlength="8" required>
      <label for="password2">Confirmer</label>
      <input type="password" id="password2" autocomplete="new-password" minlength="8" required>
      <button class="btn primary" type="submit" id="submitBtn">Valider</button>
      <div class="msg" id="formMsg"></div>
    </form>
  </div>
</main>
<footer class="site">Ludodex Online</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
